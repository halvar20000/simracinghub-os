<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <clipPath id="tileclip">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <ellipse cx="256" cy="236" rx="320" ry="300" fill="url(#glow)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none"
        stroke="#ff6b35" stroke-opacity="0.28" stroke-width="3"/>

  <!-- speed gauge -->
  <g fill="none" stroke-linecap="round">
    <path d="M 157 339 A 140 140 0 1 1 355 339" stroke="#26262f" stroke-width="30"/>
    <path d="M 157 339 A 140 140 0 1 1 355 339" stroke="url(#accent)" stroke-width="22"
          stroke-dasharray="470 700"/>
    <line x1="256" y1="240" x2="344" y2="178" stroke="url(#accent)" stroke-width="18"/>
  </g>
  <circle cx="256" cy="240" r="20" fill="#f4f4f7"/>
</svg>
